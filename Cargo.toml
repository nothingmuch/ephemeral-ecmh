[package]
name = "ephemeral-ecmh"
version = "0.1.0"
edition = "2024"
description = "Elliptic-curve multiset hashing over per-namespace random curves, compared across fields and curve models for RIBLT checksums"
license = "MIT"
publish = false

[features]
# point counting with PARI/GP (links libpari; see build.rs)
pari = []
# src/asm_probes.rs, for nix run .#asm-report
asm-probes = []

[dependencies]
crrl = { version = "0.9.0", default-features = false, features = [
  "std",
  "gfb254",
] }
sha2 = "0.11"

[dev-dependencies]
# no plotters: bench-report draws the figures, from criterion's JSON
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
  "rayon",
] }
curve25519-dalek = { version = "5.0.0", features = ["digest"] }
proptest = "1"
secp256k1 = "0.33.1"

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "compare109"
harness = false

[[bench]]
name = "agm"
harness = false

[[bench]]
name = "sieve"
harness = false

[[bench]]
name = "group"
harness = false

[[bench]]
name = "curvegen"
harness = false
required-features = ["pari"]

[[example]]
name = "curvegen_stats"
required-features = ["pari"]

[[example]]
name = "curvegen_times"
required-features = ["pari"]

# The per-commit test check: dev's debug assertions and overflow checks,
# but optimized, since the curvegen tests (sieve and AGM against Sage,
# BSGS against brute force) take 20x longer at opt-level 0. They run no
# slower at 1 than at 2, and the crate compiles in 0.8 of the time.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 3
